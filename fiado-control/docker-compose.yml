services:
  frontend:
    build:
      context: ./fiado-control/front_end
      dockerfile: Dockerfile
    container_name: fiado-control-frontend
    ports:
      - "80:80"
    networks:
      - fiado-control-network
    depends_on:
      - backend

  backend:
    build:
      context: ./fiado-control/back_end
      dockerfile: Dockerfile
    container_name: fiado-control-backend
    ports:
      - "8000:8000"
    env_file:
      - path: ./fiado-control/.env
        required: false
    volumes:
      - ./fiado-control/back_end:/app
    networks:
      - fiado-control-network
    depends_on:
      - db

  db:
    image: postgres:15
    container_name: fiadocontrol-db
    restart: always
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: adFiadPi2
      POSTGRES_DB: fiadocontrol
    ports:
      - "5432:5432"
    volumes:
      - ./fiado-control/init-scripts:/docker-entrypoint-initdb.d
    networks:
      - fiado-control-network

networks:
  fiado-control-network:
    driver: bridge
