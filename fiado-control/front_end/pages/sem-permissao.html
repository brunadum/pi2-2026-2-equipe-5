<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sem permissão | Fiado Control</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="../css/global.css">
  <link rel="stylesheet" href="../css/layout.css">
  <link rel="stylesheet" href="../css/components.css">
  <script src="../js/config.js"></script>
  <script src="../js/shared/auth.js"></script>

  <style>
    .sem-permissao{max-width:520px;margin:12vh auto 0;padding:40px 32px;text-align:center;border:1px solid var(--line);border-radius:16px;background:#fff}
    .sp-icone{display:inline-grid;place-items:center;width:64px;height:64px;margin-bottom:18px;border-radius:50%;color:#d92d20;background:#fff0f0}
    .sp-icone svg{width:30px;height:30px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
    .sem-permissao h1{margin:0 0 10px;color:var(--ink);font-size:20px;letter-spacing:-.3px}
    .sem-permissao p{margin:0 0 24px;color:var(--muted);font-size:14px;line-height:1.55}
    .sp-acoes{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
    .sp-acoes .btn{text-decoration:none}
  </style>
</head>
<body class="app-page">
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="dashboard.html">
        <span class="brand-mark" aria-hidden="true">
          <svg viewBox="0 0 24 24"><path d="M7 12 10 9a2 2 0 0 1 3 0l1 1M5 9l2-2a2 2 0 0 1 3 0l1 1m7 1-2-2a2 2 0 0 0-3 0l-5 5a2 2 0 0 0 3 3l2-2M3 6v12h18V6" /></svg>
        </span>
        <span class="brand-copy">
          <strong>Fiado Control</strong>
          <small>Gestão de Vendas</small>
        </span>
      </a>

      <!-- Navegação compartilhada: manter os caminhos relativos à pasta pages/. -->
      <nav class="main-nav" aria-label="Navegação principal">
        <a class="nav-link" href="dashboard.html">
          <svg viewBox="0 0 24 24"><rect x="3.5" y="3.5" width="7" height="7" rx="1.2"/><rect x="13.5" y="3.5" width="7" height="7" rx="1.2"/><rect x="3.5" y="13.5" width="7" height="7" rx="1.2"/><rect x="13.5" y="13.5" width="7" height="7" rx="1.2"/></svg>
          <span>Dashboard</span>
        </a>
        <a class="nav-link" href="nova-venda.html">
          <svg viewBox="0 0 24 24"><path d="M3 4h2l2.2 11.1a2 2 0 0 0 2 1.6h8.1a2 2 0 0 0 1.9-1.5L21 8H6"/><circle cx="10" cy="20" r="1.2"/><circle cx="18" cy="20" r="1.2"/></svg>
          <span>Nova Venda</span>
        </a>
        <a class="nav-link" href="clientes.html">
          <svg viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.3"/><path d="M2.8 20c.4-3.5 2.5-5.3 6.2-5.3s5.8 1.8 6.2 5.3M16 5.2a3.5 3.5 0 0 1 0 6.8M17.2 15c2.4.4 3.7 2.1 4 5"/></svg>
          <span>Clientes</span>
        </a>
        <a class="nav-link" href="registrar-pagamento.html">
          <svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 10h18M7 15h4"/></svg>
          <span>Pagamentos</span>
        </a>
        <a class="nav-link" href="relatorios-dashboard.html">
          <svg viewBox="0 0 24 24"><path d="M4 20V11M9.5 20V5M15 20v-7M20.5 20H2.5"/></svg>
          <span>Relatórios</span>
        </a>
        <a class="nav-link" href="configuracoes.html">
          <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="m19.4 15 .1.1 1.2 1-1.5 2.6-1.5-.6a7.8 7.8 0 0 1-1.7 1l-.3 1.6h-3l-.3-1.6a7.8 7.8 0 0 1-1.7-1l-1.5.6-1.5-2.6 1.2-1a7.1 7.1 0 0 1 0-2l-1.2-1 1.5-2.6 1.5.6a7.8 7.8 0 0 1 1.7-1l.3-1.6h3l.3 1.6a7.8 7.8 0 0 1 1.7 1l1.5-.6 1.5 2.6-1.2 1a7.1 7.1 0 0 1 0 2Z"/></svg>
          <span>Configurações</span>
        </a>
      </nav>

      <div class="sidebar-bottom">
        <div class="account-button">
          <span class="avatar">EF</span>
          <span class="account-copy">
            <strong>Edmilson Filho</strong>
            <small>Gerente</small>
          </span>
        </div>
      </div>
    </aside>

    <button class="sidebar-backdrop" id="sidebar-backdrop" type="button" aria-label="Fechar menu"></button>

    <main class="main-area">
      <div class="sem-permissao" role="alert">
        <span class="sp-icone" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="9" rx="2"/><path d="M8 11V8a4 4 0 0 1 8 0v3"/></svg></span>
        <h1>Você não tem permissão para acessar esta página</h1>
        <p>O seu perfil (<strong id="sp-perfil">—</strong>) não inclui este recurso. Se você precisa dele, peça a um gerente para ajustar o seu acesso.</p>
        <div class="sp-acoes">
          <a class="btn btn-primary" id="sp-voltar" href="clientes.html">Voltar ao início</a>
          <button class="btn btn-outline" id="sp-sair" type="button">Entrar com outro usuário</button>
        </div>
      </div>
    </main>
  </div>
  <script src="../js/utils/format.js"></script>
  <script src="../js/shared/ui.js"></script>
  <script>
    document.getElementById("sp-perfil").textContent = FC.auth.rotulo();
    document.getElementById("sp-voltar").href = FC.auth.paginaInicial();
    document.getElementById("sp-sair").addEventListener("click", FC.auth.sair);
  </script>
</body>
</html>
